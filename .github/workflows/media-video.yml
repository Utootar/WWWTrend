name: Render media video

# The anchor video needs a real Thai voice (edge-tts, internet). Claude's sessions cannot reach it,
# so they push media/<date>/content.json + slides, and this job renders video-<date>.mp4 and commits it.
on:
  push:
    branches: [main]
    paths: ["media/*/content.json"]
  workflow_dispatch:
    inputs:
      dates:
        description: "Dates to render, space separated (e.g. 2026-10-20 2026-10-21)"
        required: true

permissions:
  contents: write

concurrency:
  group: media-video
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      # Real presenter (free, CPU): Wav2Lip lip-syncs assets/anchor.jpg to the Thai voice.
      # Skipped when there is no assets/anchor.jpg; if setup fails the drawn anchor is used instead.
      - uses: actions/setup-python@v6
        id: py310
        if: hashFiles('assets/anchor.jpg') != ''
        with:
          python-version: "3.10"

      - name: Set up Wav2Lip
        if: hashFiles('assets/anchor.jpg') != ''
        continue-on-error: true
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          git clone --depth 1 https://github.com/Rudrabha/Wav2Lip "$RUNNER_TEMP/Wav2Lip"
          cd "$RUNNER_TEMP/Wav2Lip"
          "${{ steps.py310.outputs.python-path }}" -m venv "$RUNNER_TEMP/w2l"
          . "$RUNNER_TEMP/w2l/bin/activate"
          pip install -q torch==2.0.1 torchvision==0.15.2 --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -q numpy==1.23.5 librosa==0.9.2 opencv-python-headless==4.8.1.78 scipy tqdm numba
          for u in \
            https://huggingface.co/numz/wav2lip_studio/resolve/main/Wav2lip/wav2lip_gan.pth \
            https://huggingface.co/camenduru/Wav2Lip/resolve/main/checkpoints/wav2lip_gan.pth \
            https://huggingface.co/Nekochu/Wav2Lip/resolve/main/wav2lip_gan.pth; do
            curl -fsSL -o checkpoints/wav2lip_gan.pth "$u" && break
          done
          curl -fsSL -o face_detection/detection/sfd/s3fd.pth https://www.adrianbulat.com/downloads/python-fan/s3fd-619a316812.pth
          mkdir -p temp && ls -la checkpoints face_detection/detection/sfd
          test -s checkpoints/wav2lip_gan.pth && test -s face_detection/detection/sfd/s3fd.pth
          echo "WAV2LIP_DIR=$RUNNER_TEMP/Wav2Lip" >> "$GITHUB_ENV"
          echo "WAV2LIP_PY=$RUNNER_TEMP/w2l/bin/python" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -r requirements.txt playwright numpy edge-tts
          python -m playwright install --with-deps chromium

      - name: Pick dates
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.dates }}" ]; then
            dates="${{ github.event.inputs.dates }}"
          else
            dates=$(git diff --name-only HEAD~1 HEAD -- 'media/*/content.json' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          fi
          echo "dates=$dates" >> "$GITHUB_OUTPUT"
          echo "Rendering: $dates"

      - name: Render videos
        id: render
        run: |
          failed=""
          for d in ${{ steps.pick.outputs.dates }}; do
            python scripts/make_media.py "media/$d/content.json" --only video || failed="$failed $d"
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/*/video-*.mp4
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "media: video with Thai voice (${{ steps.pick.outputs.dates }})"
          for i in 1 2 3; do
            git pull --rebase && git push && break
            sleep 10
          done

      - name: Fail if any date failed
        if: steps.render.outputs.failed != ''
        run: |
          echo "Video failed for:${{ steps.render.outputs.failed }}"
          exit 1
