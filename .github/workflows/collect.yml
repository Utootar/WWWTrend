name: Daily news collect

on:
  schedule:
    # 04:17 Asia/Bangkok. GitHub starts scheduled runs 1.5-4 hours late (digest landed 07:34-10:19
    # in Oct 2026), so this is set early and off the hour; the Claude routines run after ~10:00.
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Collect and summarise
        id: collect
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC }}
        run: python scripts/collect.py

      # Fill the summaries the free models missed, on the owner's Claude subscription (not API billing).
      # Needs repo secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`); skipped when it is absent.
      # Never blocks the commit below: continue-on-error.
      - name: Has Claude subscription token
        id: has_claude
        run: echo "yes=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Repair missing summaries (Claude Haiku)
        if: always() && steps.collect.outcome != 'skipped' && steps.has_claude.outputs.yes == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Read CLAUDE.md and prompts/repair-summaries.md. Do steps 0-4 of that file for TODAY and YESTERDAY
            (Asia/Bangkok dates). Python dependencies are already installed, so skip pip. Use /tmp for the
            pending/summaries files. Do NOT run pytest, do NOT commit, do NOT push: the workflow commits after you.
            Summarise only; no opinions. Finish with one line: how many items fixed, how many still missing.
          claude_args: |
            --model claude-haiku-5-5
            --max-turns 20
            --allowedTools "Bash(python scripts/collect.py:*),Bash(TZ=Asia/Bangkok date:*),Read,Write"

      # Commit even when summaries failed, so raw headlines are not lost.
      - name: Commit
        if: always() && steps.collect.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "news: $(TZ=Asia/Bangkok date +%F)"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          exit 1
